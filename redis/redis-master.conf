# ══════════════════════════════════════════════════════════
#  Redis Master — Kiora HA
# ══════════════════════════════════════════════════════════

bind 0.0.0.0
port 6379

# Autenticación
requirepass REDIS_PASSWORD_PLACEHOLDER

# Persistencia (RDB + AOF para máxima durabilidad)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Límite de memoria (alineado con deploy.resources.limits en compose)
maxmemory 400mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Permitir que replicas lean aunque el master esté escribiendo
replica-lazy-flush yes
