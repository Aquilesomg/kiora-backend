# ══════════════════════════════════════════════════════════
#  Redis Sentinel — Kiora HA
#  Comparten esta misma config los 3 Sentinels.
#
#  IMPORTANTE: Redis Sentinel NO usa redis.conf sino sentinel.conf.
#  El archivo se reescribe en disco por Sentinel al detectar cambios.
# ══════════════════════════════════════════════════════════

port 26379
bind 0.0.0.0

# ── Monitor del master ────────────────────────────────────
# Formato: sentinel monitor <nombre> <host> <puerto> <quórum>
# Quórum = 2: al menos 2 de 3 sentinels deben acordar que el master cayó
sentinel monitor kiora-master redis-master 6379 2

# Contraseña del master (y réplicas, que tienen la misma)
sentinel auth-pass kiora-master REDIS_PASSWORD_PLACEHOLDER

# Tiempo sin respuesta para considerar el master caído (ms)
sentinel down-after-milliseconds kiora-master 5000

# Tiempo máximo para completar el failover (ms)
sentinel failover-timeout kiora-master 60000

# Cuántas réplicas pueden sincronizar con el nuevo master a la vez
# 1 = conservador, evita sobrecarga durante failover
sentinel parallel-syncs kiora-master 1

# Anunciar IP/puerto para entornos Docker (Sentinels descubren su propia IP)
# No es necesario en Docker Compose con red bridge — los nombres DNS funcionan

loglevel notice
logfile ""
