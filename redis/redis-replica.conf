# ══════════════════════════════════════════════════════════
#  Redis Replica — Kiora HA
#  Comparten esta misma config las 2 réplicas.
# ══════════════════════════════════════════════════════════

bind 0.0.0.0
port 6379

# Replicación: apuntar al master por nombre de servicio Docker
replicaof redis-master 6379

# Credenciales: replica debe autenticarse al master y también proteger su puerto
masterauth REDIS_PASSWORD_PLACEHOLDER
requirepass REDIS_PASSWORD_PLACEHOLDER

# Solo lectura en réplicas (garantía de consistencia)
replica-read-only yes

# Persistencia (ligera en réplicas para reducir I/O)
save 900 1
appendonly no

maxmemory 400mb
maxmemory-policy allkeys-lru

loglevel notice
logfile ""
