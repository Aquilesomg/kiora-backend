# Prometheus configuration for Kiora backend
# Scrapes /metrics from each microservice every 15 seconds

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: /metrics

  - job_name: 'products-service'
    static_configs:
      - targets: ['products-service:3002']
    metrics_path: /metrics

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:3003']
    metrics_path: /metrics

  - job_name: 'orders-service'
    static_configs:
      - targets: ['orders-service:3004']
    metrics_path: /metrics

  - job_name: 'users-service'
    static_configs:
      - targets: ['users-service:3001']
    metrics_path: /metrics

  # Traefik expone sus métricas en el puerto del dashboard (8080)
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  # Redis Sentinel — métricas via redis_exporter (opcional, ya que redis:7-alpine no expone /metrics)
  # Para habilitarlo agrega el contenedor oliver006/redis_exporter al compose.
  # - job_name: 'redis-master'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #   metrics_path: /metrics
