  # ─────────────────────────────────────────────
  # REDIS HA — Sentinel (1 master + 2 replicas + 3 sentinels)
  # Elimina el SPOF del Redis único anterior.
  # Failover automático en ~5s si el master no responde.
  # ─────────────────────────────────────────────

  redis-master:
    image: redis:7-alpine
    container_name: kiora_redis_master
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command: >
      sh -c 'cp /etc/redis/redis-master.conf /tmp/redis.conf &&
             sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$$REDIS_PASSWORD/g" /tmp/redis.conf &&
             redis-server /tmp/redis.conf'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - redis_master_data:/data
    - ./redis/redis-master.conf:/etc/redis/redis-master.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-1:
    image: redis:7-alpine
    container_name: kiora_redis_replica_1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c 'cp /etc/redis/redis-replica.conf /tmp/redis.conf &&
             sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$$REDIS_PASSWORD/g" /tmp/redis.conf &&
             redis-server /tmp/redis.conf'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - redis_replica_1_data:/data
    - ./redis/redis-replica.conf:/etc/redis/redis-replica.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    container_name: kiora_redis_replica_2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c 'cp /etc/redis/redis-replica.conf /tmp/redis.conf &&
             sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$$REDIS_PASSWORD/g" /tmp/redis.conf &&
             redis-server /tmp/redis.conf'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - redis_replica_2_data:/data
    - ./redis/redis-replica.conf:/etc/redis/redis-replica.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: kiora_redis_sentinel_1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    command: >
      sh -c 'cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$$REDIS_PASSWORD/g" /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: kiora_redis_sentinel_2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    command: >
      sh -c 'cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$$REDIS_PASSWORD/g" /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: kiora_redis_sentinel_3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    command: >
      sh -c 'cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$$REDIS_PASSWORD/g" /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD no esta definido}
    networks:
    - kiora-backend-net
    volumes:
    - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy


  # ─────────────────────────────────────────────
  # BALANCEADOR DE CARGA (Traefik)
  # ─────────────────────────────────────────────

  traefik:
    image: traefik:v2.11
    container_name: kiora_traefik
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Configura LETSENCRYPT_EMAIL en el entorno}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"        # HTTP público (redirecciona a HTTPS)
      - "443:443"      # HTTPS público
    networks:
      - traefik-public
      - kiora-backend-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Lectura-only por seguridad
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt

    depends_on:
      api-gateway:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # MICROSERVICIOS
  # ─────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      additional_contexts:
        - shared=./services/shared
    # container_name eliminado: Docker Compose no permite nombre fijo con múltiples réplicas.
    # Las réplicas se nombran automáticamente: kiora-backend-api-gateway-1, -2, etc.
    restart: unless-stopped
    deploy:
      replicas: 2       # Alta disponibilidad: si una réplica cae, la otra sigue sirviendo
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # Sin ports directos al host: Traefik gestiona el acceso externo
    networks:
      - traefik-public    # Para que Traefik pueda balancear el tráfico
      - kiora-backend-net # Para que el gateway acceda a los microservicios internos
    labels:
      # Habilitar descubrimiento por Traefik
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # ── Router HTTPS ──────────────────────────────────────────
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.rule=Host(`${DOMAIN_NAME:?Configura DOMAIN_NAME en el entorno}`)"
      - "traefik.http.routers.api-gateway.tls=true"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      # Middlewares aplicados en orden
      - "traefik.http.routers.api-gateway.middlewares=secure-headers@file,compress@file,retry-on-error@file"
      # ── Backend ─────────────────────────────────────────────
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"
      # Health check que Traefik usa para detectar réplicas caídas
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.timeout=3s"
      # Balanceo round-robin (default), sin afinidad de sesión (JWT es stateless)

    env_file:
    - ./services/api-gateway/.env.docker
    environment:
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      REDIS_HOST: redis-master
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_NAME: kiora-master
      USERS_SERVICE_URL: http://users-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      ORDERS_SERVICE_URL: http://orders-service:3004
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3005
      REPORTS_SERVICE_URL: http://reports-service:3006
      ACTIVITY_SERVICE_URL: http://activity-service:3007
      AI_SERVICE_URL: http://ai-service:3008
      STORES_SERVICE_URL: http://stores-service:3009
    depends_on:
      redis-master:
        condition: service_healthy
      users-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
