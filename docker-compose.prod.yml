  telegram-bot:
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
      additional_contexts:
        - shared=./services/shared
    container_name: kiora_telegram_bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
    - kiora-backend-net
    env_file:
    - ./services/telegram-bot/.env.docker
    environment:
      REDIS_HOST: redis-master
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_NAME: kiora-master
      REDIS_PORT: 6379
      API_GATEWAY_URL: http://api-gateway:3000/api
      TZ: ${TZ:-America/Bogota}
    depends_on:
      redis-master:
        condition: service_healthy

  activity-db:
    image: postgres:16-alpine
    container_name: kiora_activity_db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definido}
      POSTGRES_DB: kiora_activity
    networks:
    - kiora-backend-net
    volumes:
    - activity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d kiora_activity"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: kiora_ai_service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
    - kiora-backend-net
    env_file:
    - ./services/ai-service/.env.docker
    environment:
      API_GATEWAY_URL: http://api-gateway:3000/api
      TZ: ${TZ:-America/Bogota}

    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3008/health
      interval: 15s
      timeout: 5s
      retries: 5
  activity-service:
    build:
      context: ./services/activity-service
      dockerfile: Dockerfile
    container_name: kiora_activity_service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
    - kiora-backend-net
    env_file:
    - ./services/activity-service/.env.docker
    environment:
      DB_HOST: activity-db
      DB_PORT: 5432
      TZ: ${TZ:-America/Bogota}
    depends_on:
      activity-db:
        condition: service_healthy

    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3007/api/activity/health
      interval: 15s
      timeout: 5s
      retries: 5

  siesa-integration-service:
    build:
      context: ./services/siesa-integration-service
      dockerfile: Dockerfile
    container_name: kiora_siesa_integration
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    networks:
    - kiora-backend-net
    env_file:
    - ./services/siesa-integration-service/.env.docker
    environment:
      REDIS_HOST: redis-master
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_NAME: kiora-master
      TZ: ${TZ:-America/Bogota}
    depends_on:
      redis-master:
