          memory: 512M
    networks:
    - kiora-backend-net
    env_file:
    - ./services/stores-service/.env.docker
    environment:
      DB_HOST: stores-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definido}
      DB_NAME: kiora_stores
      DATABASE_URL: 
        postgres://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD no esta definido}@stores-db:5432/kiora_stores
      OTEL_SERVICE_NAME: stores-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TZ: ${TZ:-America/Bogota}
    depends_on:
      stores-db:
        condition: service_healthy

    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3009/api/stores/health
      interval: 15s
      timeout: 5s
      retries: 5

